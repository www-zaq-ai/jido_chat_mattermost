name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  MIX_ENV: test

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27.3"
          elixir-version: "1.18.4"

      - name: Restore dependencies and build
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build/test
          key: ${{ runner.os }}-quality-otp27.3-elixir1.18.4-${{ hashFiles('mix.lock') }}

      - name: Restore Dialyzer PLTs
        uses: actions/cache@v5
        with:
          path: priv/plts
          key: ${{ runner.os }}-plt-otp27.3-elixir1.18.4-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-plt-otp27.3-elixir1.18.4-

      - name: Install Hex/Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Install dependencies
        run: mix deps.get

      - name: Check quality
        run: mix quality

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27.3"
          elixir-version: "1.18.4"

      - name: Restore dependencies and build
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build/test
          key: ${{ runner.os }}-test-otp27.3-elixir1.18.4-${{ hashFiles('mix.lock') }}

      - name: Install Hex/Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Install dependencies
        run: mix deps.get

      - name: Run tests
        run: mix test

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      code-quality: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27.3"
          elixir-version: "1.18.4"

      - name: Restore cached deps
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-coverage-otp27.3-elixir1.18.4-${{ hashFiles('mix.lock') }}

      - name: Install Hex/Rebar
        run: |
          set -euo pipefail
          mix local.hex --force
          mix local.rebar --force

      - name: Install dependencies
        run: mix deps.get

      - name: Run coverage
        run: mix coveralls.cobertura

      - name: Save coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: cover/cobertura.xml
          if-no-files-found: ignore

      - name: Upload coverage to GitHub
        if: >-
          !cancelled() && hashFiles('cover/cobertura.xml') != '' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/upload-code-coverage@v1
        with:
          file: cover/cobertura.xml
          language: Elixir
          label: code-coverage/excoveralls

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && hashFiles('cover/cobertura.xml') != '' }}
        uses: codecov/codecov-action@v5
        with:
          files: ./cover/cobertura.xml
          token: ${{ secrets.CODECOV_TOKEN }}
