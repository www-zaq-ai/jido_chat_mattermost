name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  MIX_ENV: test

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27.3"
          elixir-version: "1.18.4"

      - name: Restore dependencies and build
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build/test
          key: ${{ runner.os }}-quality-otp27.3-elixir1.18.4-${{ hashFiles('mix.lock') }}

      - name: Restore Dialyzer PLTs
        uses: actions/cache@v5
        with:
          path: priv/plts
          key: ${{ runner.os }}-plt-otp27.3-elixir1.18.4-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-plt-otp27.3-elixir1.18.4-

      - name: Install Hex/Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Install dependencies
        run: mix deps.get

      - name: Check quality
        run: mix quality

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27.3"
          elixir-version: "1.18.4"

      - name: Restore dependencies and build
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build/test
          key: ${{ runner.os }}-test-otp27.3-elixir1.18.4-${{ hashFiles('mix.lock') }}

      - name: Install Hex/Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Install dependencies
        run: mix deps.get

      - name: Run tests
        run: mix test

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27.3"
          elixir-version: "1.18.4"

      - name: Restore cached deps
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-coverage-otp27.3-elixir1.18.4-${{ hashFiles('mix.lock') }}

      - name: Install Hex/Rebar
        run: |
          set -euo pipefail
          mix local.hex --force
          mix local.rebar --force

      - name: Install dependencies
        run: mix deps.get

      - name: Run coverage
        run: mix coveralls.json

      - name: Save coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: cover/excoveralls.json
          if-no-files-found: ignore

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: ./cover/excoveralls.json
          token: ${{ secrets.CODECOV_TOKEN }}
